<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-label="Hedayat lighthouse illustration">
  <defs>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#BEAE59" stop-opacity=".55"/>
      <stop offset="1" stop-color="#BEAE59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E69D74" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E69D74" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset=".55" stop-color="#F7E7A8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#BEAE59" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tower">
      <path d="M186 214 L254 214 L276 470 L164 470 Z"/>
    </clipPath>
    <clipPath id="medallion">
      <ellipse cx="220" cy="290" rx="205" ry="262"/>
    </clipPath>
    <g id="star">
      <rect x="-10" y="-10" width="20" height="20"/>
      <rect x="-10" y="-10" width="20" height="20" transform="rotate(45)"/>
    </g>
  </defs>

  <!-- soft halo -->
  <circle cx="220" cy="250" r="190" fill="#FBE9DE"/>
  <circle cx="220" cy="250" r="150" fill="#F7F2DD" opacity=".75"/>

  <!-- decorative identity stars -->
  <use href="#star" fill="#BEAE59" opacity=".55" transform="translate(70 120) scale(.9)"/>
  <use href="#star" fill="#96BDBC" opacity=".7" transform="translate(372 96) scale(.7)"/>
  <use href="#star" fill="#E06659" opacity=".45" transform="translate(386 300) scale(.55)"/>
  <use href="#star" fill="#647550" opacity=".4" transform="translate(48 330) scale(.6)"/>

  <g clip-path="url(#medallion)">
  <!-- light beams -->
  <path d="M206 150 L10 70 L10 210 Z" fill="url(#beamL)"/>
  <path d="M234 150 L430 70 L430 210 Z" fill="url(#beamR)"/>
  <circle cx="220" cy="150" r="56" fill="url(#glow)"/>

  <!-- tower body with bands -->
  <g clip-path="url(#tower)">
    <rect x="150" y="210" width="140" height="270" fill="#FFFDFC"/>
    <rect x="150" y="250" width="140" height="34" fill="#286583"/>
    <rect x="150" y="330" width="140" height="34" fill="#286583"/>
    <rect x="150" y="410" width="140" height="34" fill="#286583"/>
    <!-- shading on one side -->
    <path d="M220 214 L254 214 L276 470 L220 470 Z" fill="#3E4C42" opacity=".07"/>
  </g>
  <path d="M186 214 L254 214 L276 470 L164 470 Z" fill="none" stroke="#3E4C42" stroke-opacity=".18" stroke-width="2"/>

  <!-- windows -->
  <rect x="213" y="296" width="14" height="22" rx="7" fill="#96BDBC"/>
  <rect x="211" y="376" width="18" height="24" rx="9" fill="#96BDBC"/>
  <!-- door -->
  <path d="M206 470 L206 446 A14 14 0 0 1 234 446 L234 470 Z" fill="#647550"/>

  <!-- gallery / balcony -->
  <rect x="172" y="196" width="96" height="18" rx="3" fill="#647550"/>
  <g stroke="#647550" stroke-width="3" stroke-linecap="round">
    <line x1="176" y1="180" x2="264" y2="180"/>
    <line x1="180" y1="180" x2="180" y2="196"/>
    <line x1="196" y1="180" x2="196" y2="196"/>
    <line x1="212" y1="180" x2="212" y2="196"/>
    <line x1="228" y1="180" x2="228" y2="196"/>
    <line x1="244" y1="180" x2="244" y2="196"/>
    <line x1="260" y1="180" x2="260" y2="196"/>
  </g>

  <!-- lantern room -->
  <rect x="192" y="124" width="56" height="56" rx="4" fill="#F7E7A8"/>
  <g stroke="#286583" stroke-width="3">
    <rect x="192" y="124" width="56" height="56" rx="4" fill="none"/>
    <line x1="211" y1="124" x2="211" y2="180"/>
    <line x1="229" y1="124" x2="229" y2="180"/>
  </g>
  <!-- dome -->
  <path d="M186 126 Q220 82 254 126 Z" fill="#E06659"/>
  <rect x="184" y="122" width="72" height="7" rx="3" fill="#E06659"/>
  <!-- finial star -->
  <line x1="220" y1="96" x2="220" y2="80" stroke="#BEAE59" stroke-width="3"/>
  <use href="#star" fill="#BEAE59" transform="translate(220 70) scale(.8)"/>

  <!-- rocks / base -->
  <path d="M120 478 Q150 452 196 466 Q232 448 270 466 Q312 452 336 480 L336 500 L110 500 Z" fill="#647550"/>
  <path d="M96 494 Q128 476 160 488 L168 506 L92 506 Z" fill="#75865F"/>
  <path d="M300 488 Q330 470 356 490 L360 506 L296 506 Z" fill="#75865F"/>

  <!-- sea waves -->
  <path d="M20 500 Q60 484 100 500 T180 500 T260 500 T340 500 T420 500 L420 560 L20 560 Z" fill="#96BDBC"/>
  <path d="M20 522 Q60 506 100 522 T180 522 T260 522 T340 522 T420 522 L420 560 L20 560 Z" fill="#286583" opacity=".85"/>
  <path d="M60 540 Q80 532 100 540 M250 536 Q270 528 290 536" stroke="#E8F2F1" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
