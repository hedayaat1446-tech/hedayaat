<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#16404F" />
<title>لا يوجد اتصال | مؤسسة هدايات التعليمية</title>
<style>
@font-face{font-family:'The Year of Handicrafts';src:url('/fonts/TheYearofHandicrafts-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF9F4;color:#2F3D36;font-family:'The Year of Handicrafts',Tahoma,sans-serif;padding:24px}
.card{max-width:520px;width:100%;text-align:center;background:#fff;border:1px solid rgba(22,64,79,.08);border-radius:22px;padding:40px 28px;box-shadow:0 18px 40px rgba(22,64,79,.1)}
img{height:56px;width:auto;margin-bottom:22px}h1{margin:0 0 6px;color:#16404F;font-size:1.5rem}h2{margin:0 0 18px;color:#5B675F;font-size:1rem;font-weight:700}
p{margin:0 0 6px;line-height:1.9;color:#5B675F}button{margin-top:22px;min-height:50px;padding:0 28px;border:0;border-radius:999px;background:#16404F;color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.en{direction:ltr;margin-top:18px;padding-top:18px;border-top:1px solid rgba(190,174,89,.3)}
</style>
</head>
<body>
<main class="card">
  <img src="/hedayat-logo-gold.png" alt="شعار مؤسسة هدايات التعليمية" width="900" height="337" />
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذر تحميل هذه الصفحة حاليًا. تحقّق من اتصالك ثم أعد المحاولة.</p>
  <p class="en">You appear to be offline. Please check your connection and try again.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة · Try again</button>
</main>
</body>
</html>
